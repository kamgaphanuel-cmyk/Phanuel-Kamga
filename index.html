<!DOCTYPE html>
<html lang="fr">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Phanuel Kamga Portfolio</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/particles.js@2.0.0/particles.min.js"></script>

<style>

:root{
--green:#1faa59;
--bg:#071019;
--glass:rgba(255,255,255,.08);
}

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Poppins,sans-serif;
}

html{
scroll-behavior:smooth;
}

body{
background:var(--bg);
color:white;
overflow-x:hidden;
}

/* loader */

.loader{
position:fixed;
inset:0;
background:#071019;
display:flex;
justify-content:center;
align-items:center;
font-size:2rem;
font-weight:700;
z-index:9999;
animation:fadeout 1s forwards;
animation-delay:2s;
}

@keyframes fadeout{
to{
opacity:0;
visibility:hidden;
}
}

/* particles */

#particles-js{
position:fixed;
width:100%;
height:100%;
z-index:-2;
}

/* aurora */

.bg{
position:fixed;
inset:0;
z-index:-1;
background:
radial-gradient(circle at 20% 30%,#1faa5940,transparent),
radial-gradient(circle at 80% 20%,#00ffee20,transparent),
radial-gradient(circle at 50% 90%,#ffffff15,transparent);

filter:blur(80px);

animation:move 10s infinite alternate;
}

@keyframes move{

from{
transform:translateY(-50px);
}

to{
transform:translateY(50px);
}

}

nav{

position:fixed;
top:0;
width:100%;
padding:20px 8%;

display:flex;
justify-content:space-between;
align-items:center;

backdrop-filter:blur(20px);

z-index:999;

}

nav ul{

display:flex;
gap:20px;
list-style:none;

}

nav a{

color:white;
text-decoration:none;

}

section{

padding:120px 8%;

}

.hero{

height:100vh;

display:flex;
justify-content:center;
align-items:center;

text-align:center;

}

.glass{

background:var(--glass);

padding:40px;

border-radius:25px;

backdrop-filter:blur(20px);

box-shadow:0 10px 40px rgba(0,0,0,.4);

}

.profile{

width:190px;
height:190px;

border-radius:50%;

object-fit:cover;

border:5px solid white;

transition:.6s;

}

.profile:hover{

transform:
rotateY(180deg)
scale(1.08);

}

.btn{

padding:12px 24px;

border:none;

border-radius:12px;

background:var(--green);

color:white;

cursor:pointer;

margin-top:12px;

}

.grid{

display:grid;

grid-template-columns:

repeat(auto-fit,minmax(280px,1fr));

gap:25px;

}

.card{

background:var(--glass);

padding:25px;

border-radius:20px;

transition:.5s;

transform-style:preserve-3d;

}

.card:hover{

transform:

translateY(-10px)

rotateX(5deg)

rotateY(-5deg);

}

.skill{

margin-top:20px;

}

.bar{

height:10px;

background:#ffffff20;

border-radius:30px;

overflow:hidden;

}

.fill{

height:100%;

background:var(--green);

}

.project img{

width:100%;
height:180px;

object-fit:cover;

border-radius:12px;

}

.hidden{

opacity:0;

transform:translateY(100px);

transition:1s;

}

.show{

opacity:1;

transform:none;

}

.cursor{

position:fixed;

width:20px;

height:20px;

border:2px solid white;

border-radius:50%;

pointer-events:none;

transform:translate(-50%,-50%);

z-index:99999;

}

.top{

position:fixed;

right:20px;

bottom:20px;

display:none;

}

input,textarea{

width:100%;

padding:12px;

margin-top:10px;

border:none;

border-radius:10px;

}

@media(max-width:800px){

nav ul{

display:none;

}

}

</style>

</head>

<body>

<div class="loader">

Portfolio Loading...

</div>

<div id="particles-js"></div>

<div class="bg"></div>

<div class="cursor"></div>

<nav>

<h2>Phanuel</h2>

<ul>

<li><a href="#about">About</a></li>

<li><a href="#skills">Skills</a></li>

<li><a href="#projects">Projects</a></li>

<li><a href="#contact">Contact</a></li>

</ul>

</nav>

<section class="hero">

<div class="glass hidden">

<img

id="profile"

class="profile"

src="https://i.ibb.co/21HVWMpG/199371.jpg">

<br>

<input

hidden

type="file"

accept="image/*"

id="photo">

<button

class="btn"

onclick="photo.click()">

Changer Photo

</button>

<h1 id="typing"></h1>

<p>

Développeur Web • UI/UX • Python

</p>

</div>

</section>

<section id="about">

<div class="glass hidden">

<h2>À propos</h2>

<p>

Création de solutions modernes,
interfaces premium et expériences utilisateurs.

</p>

</div>

</section>

<section id="skills">

<h2 class="hidden">

Compétences

</h2>

<div class="skill hidden">

HTML

<div class="bar">

<div class="fill" style="width:95%"></div>

</div>

</div>

<div class="skill hidden">

CSS

<div class="bar">

<div class="fill" style="width:90%"></div>

</div>

</div>

<div class="skill hidden">

JavaScript

<div class="bar">

<div class="fill" style="width:85%"></div>

</div>

</div>

</section>

<section id="projects">

<h2 class="hidden">

Mes projets

</h2>

<div

class="grid"

id="projectsContainer">

</div>

<div class="card">

<input id="title" placeholder="Titre">

<input id="desc" placeholder="Description">

<input id="img" placeholder="Image URL">

<button

class="btn"

onclick="addProject()">

Ajouter Projet

</button>

</div>

</section>

<section id="contact">

<div class="glass hidden">

<input placeholder="Nom">

<input placeholder="Email">

<textarea rows="6" placeholder="Message"></textarea>

<button class="btn">

Envoyer

</button>

</div>

</section>

<button id="top" class="btn top">

↑

</button>

<script>

photo.onchange=e=>{

profile.src=

URL.createObjectURL(

e.target.files[0]

);

};

const txt="Phanuel Kamga";

let i=0;

setInterval(()=>{

if(i<txt.length){

typing.innerHTML+=txt[i];

i++;

}

},120);

function addProject(){

projectsContainer.innerHTML+=`

<div class="card project hidden">

<img src="${img.value||'https://picsum.photos/400'}">

<h3>${title.value}</h3>

<p>${desc.value}</p>

</div>

`;

}

const observer=

new IntersectionObserver(

entries=>{

entries.forEach(

e=>{

if(e.isIntersecting){

e.target.classList.add(

"show"

);

}

}

)

}

);

document

.querySelectorAll(".hidden")

.forEach(

x=>observer.observe(x)

);

document.addEventListener(

"mousemove",

e=>{

document.querySelector(

".cursor"

).style.left=e.clientX+"px";

document.querySelector(

".cursor"

).style.top=e.clientY+"px";

}

);

window.onscroll=()=>{

top.style.display=

scrollY>500

? "block"

: "none";

};

top.onclick=()=>{

scrollTo({

top:0,

behavior:"smooth"

});

};

particlesJS(

"particles-js",

{

particles:{

number:{value:60},

size:{value:3},

move:{speed:2},

line_linked:{enable:true}

}

}

);

</script>

</body>

  </html>
